# 携帯からSSHで使うときの tmux 設定。
#
#   cat scripts/tmux-mobile.conf >> ~/.tmux.conf
#
# もしくは、この内容を ~/.tmux.conf に貼る。

# 画面をタップ・スワイプで操作できるようにする(スクロールが格段に楽になる)
set -g mouse on

# 携帯の細い画面ではステータス行も惜しい。最小限にする。
set -g status-left ""
set -g status-right " #S "
set -g status-style "bg=default fg=colour244"

# 接続が切れて再接続したとき、実際の画面幅に合わせ直す
setw -g aggressive-resize on

# 履歴を長めに持つ(携帯では遡って読むことが多い)
set -g history-limit 20000

# エスケープの取りこぼしを減らす(SSH越しの体感が変わる)
set -sg escape-time 10

# 色を正しく出す
set -g default-terminal "screen-256color"

# 画面から手を離している時間が長いので、勝手にデタッチしない
set -g destroy-unattached off
