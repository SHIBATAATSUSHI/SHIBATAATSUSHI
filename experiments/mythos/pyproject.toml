[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mythos"
version = "0.1.0"
description = "端末で動くミニ・コーディングエージェント"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["anthropic>=0.121.0"]

[project.scripts]
mythos = "mythos.cli:main"

[tool.setuptools]
packages = ["mythos"]
